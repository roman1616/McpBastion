name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    name: Rust gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup component add clippy rustfmt
